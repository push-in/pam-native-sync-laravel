name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        laravel:
          - version: '^12.0'
            testbench: '^10.0'
          - version: '^13.0'
            testbench: '^11.0'
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: Validate package metadata
        run: composer validate --strict --no-check-lock
      - name: Install locked-compatible dependencies
        run: |
          composer require --dev \
            "orchestra/testbench:${{ matrix.laravel.testbench }}" \
            --no-update --no-interaction
          composer update \
            "laravel/framework:${{ matrix.laravel.version }}" \
            "orchestra/testbench:${{ matrix.laravel.testbench }}" \
            --with-all-dependencies \
            --prefer-dist --no-interaction --no-progress
      - name: Run package contracts
        run: composer test
